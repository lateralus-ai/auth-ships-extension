# Overrides for the stock Keycloak strings. Everything not listed here falls
# through to the parent theme's bundle.

# Shown as the warning banner when the CONFIGURE_TOTP required action fires.
# Stock text is "You need to set up Mobile Authenticator to activate your
# account." — "activate your account" reads like the account is not yet live.
configureTotpMessage=Set up two-factor authentication to finish signing in.
